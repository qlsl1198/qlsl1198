name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/generate_profile_stats.py'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate self-hosted SVG cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_stats.py
      - name: Commit cards when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile cards'
            git push
          fi
