name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 새벽 자동 실행
  workflow_dispatch:     # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃 (전체 히스토리 포함)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Snake animation 생성
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: qlsl1198   # <-- 본인 GitHub 아이디
          outputs: dist/snake.svg

      # 3️⃣ Git 설정
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4️⃣ output 브랜치 준비
      - name: Prepare output branch
        run: |
          git fetch origin output || echo "output branch does not exist"
          git checkout -B output origin/output || git checkout -B output

      # 5️⃣ Commit 변경사항 (없으면 skip)
      - name: Commit changes
        run: |
          git add dist/snake.svg
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Update Snake Animation"
          fi

      # 6️⃣ Push
      - name: Push to output branch
        run: git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
