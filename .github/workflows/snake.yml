name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 새벽 자동 실행
  workflow_dispatch:     # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Snake animation 생성
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: qlsl1198
          outputs: dist/snake.svg

      # 3️⃣ Deploy to output branch using PAT
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}  # 새로 발급한 PAT 사용
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
